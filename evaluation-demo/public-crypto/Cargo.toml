[package]
name = "ghost-public-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10"
pqcrypto-mlkem = "0.1.1"
pqcrypto-mldsa = "0.1.2"
pqcrypto-traits = "0.3.5"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"

[workspace]
